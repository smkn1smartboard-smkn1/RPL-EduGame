<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasir Quest — Turnamen Kelas</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf1f7;--card:#fff;--ink:#14213d;--mute:#5b6b85;--line:#c9d6e6;--acc:#0f8f7f;--acc2:#ffc83d;--bad:#d64545;--code:#14213d;--codeink:#e6f0ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#17233a;--ink:#e8eef8;--mute:#93a4c0;--line:#2a3a58;--acc:#2fc9b4;--bad:#ff6b6b;--code:#0a111f;--codeink:#cfe1ff}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#17233a;--ink:#e8eef8;--mute:#93a4c0;--line:#2a3a58;--acc:#2fc9b4;--bad:#ff6b6b;--code:#0a111f;--codeink:#cfe1ff}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:2rem;margin:.2em 0;line-height:1.1}
h2{font-size:1.4rem;margin:0 0 .6em;line-height:1.3}
p{line-height:1.5;color:var(--mute);margin:.4em 0}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:16px;margin:14px 0;box-shadow:4px 4px 0 var(--ink)}
button,summary{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.lv{background:var(--card);border:2px solid var(--ink);border-radius:12px;margin:10px 0;overflow:hidden}
.lv .row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;background:none;border:0;text-align:left;font-weight:700}
.lv small{display:block;font-weight:500;color:var(--mute)}
.ic{font-size:1.6rem}
.star{margin-left:auto;letter-spacing:2px;color:#e0a800}
details{border-top:2px dashed var(--line);padding:0 14px}
summary{min-height:44px;display:flex;align-items:center;color:var(--mute);font-size:.9rem}
details ol{margin:0 0 10px;padding-left:22px;line-height:1.7;font-size:.92rem}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px}
.bar{height:10px;border:2px solid var(--ink);border-radius:8px;background:var(--card);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
pre{background:var(--code);color:var(--codeink);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.88rem;padding:12px;border-radius:10px;overflow-x:auto;margin:10px 0}
.opt{display:block;width:100%;min-height:52px;text-align:left;padding:12px 14px;margin:9px 0;background:var(--card);border:2px solid var(--ink);border-radius:12px;font:inherit;font-weight:500;color:var(--ink)}
.opt.ok{background:var(--acc);color:#fff;border-color:var(--acc)}
.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.fb{border-left:6px solid var(--acc);padding:8px 12px;margin:12px 0;background:var(--bg);border-radius:0 10px 10px 0;line-height:1.5}
.fb.no{border-color:var(--bad)}
.cta{min-height:52px;width:100%;background:var(--acc2);color:#14213d;border:2px solid var(--ink);border-radius:12px;font-weight:700;font-size:1.05rem;box-shadow:3px 3px 0 var(--ink);margin-top:10px}
.ghost{background:transparent;box-shadow:none;color:var(--ink)}
.big{font-size:2.6rem;font-weight:700;margin:.1em 0;color:#e0a800}
label{display:block;font-weight:700;margin:12px 0 6px}
select,input{width:100%;min-height:48px;font:inherit;padding:8px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink)}
.mini{min-height:40px;padding:0 14px;border:2px solid var(--ink);border-radius:10px;background:var(--card);font-weight:700}
.sb{display:flex;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:2;padding:8px 0;background:var(--bg)}
.tm{flex:1;border:2px solid var(--ink);border-top:10px solid var(--c);border-radius:12px;background:var(--card);padding:6px 4px;text-align:center;font-size:.85rem}
.tm span{display:block;font-size:1.7rem;font-weight:700}
.tgs{display:flex;gap:8px}
.tgb{flex:1;min-height:56px;border:2px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-weight:700}
.tgb[aria-pressed=true]{background:var(--c);color:#fff;border-color:var(--c)}
.opt{cursor:default}
ol.how{padding-left:22px;line-height:1.7;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const L=[
{n:'Kenali Toko & Alur Kasir',ic:'🧾',p:['Survei UMKM & kebutuhan kasir','Alur transaksi jual-beli','Algoritma & pseudocode','Flowchart transaksi','Rancang fitur POS'],q:[
{q:'Urutan alur transaksi kasir yang benar adalah…',o:['Bayar → Pilih barang → Cetak struk','Pilih barang → Hitung total → Bayar → Cetak struk','Cetak struk → Bayar → Hitung total','Hitung total → Cetak struk → Pilih barang'],a:1,e:'Barang dipilih dulu, total dihitung, pembeli membayar, lalu struk dicetak.'},
{q:'Untuk mengecek “Stok tersedia?” di flowchart, simbol yang dipakai adalah…',o:['Oval','Persegi panjang','Belah ketupat','Jajar genjang'],a:2,e:'Belah ketupat (decision) punya dua jalur: Ya dan Tidak.'},
{q:'Contoh INPUT pada aplikasi kasir adalah…',o:['Struk belanja','Jumlah barang yang dibeli','Total bayar di layar','Laporan harian'],a:1,e:'Input adalah data yang dimasukkan ke program.'},
{q:'Contoh OUTPUT pada aplikasi kasir adalah…',o:['Struk belanja','Nama barang yang diketik','Uang dari pembeli','Kode barcode yang dipindai'],a:0,e:'Output adalah hasil yang ditampilkan atau dicetak program.'}]},
{n:'Variabel & Tipe Data',ic:'📦',p:['Pengenalan Python & editor','Variabel: nama_barang, harga','Tipe data int, float, str, bool','Input dan output','Hitung total belanja'],q:[
{q:'Tipe data yang cocok untuk harga = 15000 adalah…',o:['str','int','bool','list'],a:1,e:'Bilangan bulat disimpan sebagai int.'},
{q:'Tipe data untuk nama_barang = "Kopi Susu" adalah…',o:['int','float','str','bool'],a:2,e:'Teks di dalam tanda kutip bertipe str (string).'},
{q:'Apa output kode ini?',c:'harga = 5000\nqty = 3\nprint(harga * qty)',o:['8000','15000','5000 3','Error'],a:1,e:'5000 dikali 3 hasilnya 15000.'},
{q:'Status stok “tersedia” atau “tidak tersedia” paling cocok disimpan sebagai…',o:['Boolean','Float','String panjang','Integer besar'],a:0,e:'Boolean hanya bernilai True atau False.'}]},
{n:'Diskon & Kembalian',ic:'🏷️',p:['Operator hitung & bandingkan','if-else','elif untuk banyak kondisi','Diskon & kembalian','Validasi stok'],q:[
{q:'Apa output kode ini?',c:'total = 120000\nif total >= 100000:\n    diskon = 10\nelse:\n    diskon = 0\nprint(diskon)',o:['0','10','120000','Error'],a:1,e:'120000 ≥ 100000 benar, jadi diskon bernilai 10.'},
{q:'Apa output kode ini?',c:'stok = 0\nif stok > 0:\n    print("Ada")\nelse:\n    print("Habis")',o:['Ada','Habis','0','Error'],a:1,e:'stok > 0 salah, jadi blok else dijalankan.'},
{q:'Apa output kode ini?',c:'uang = 50000\ntotal = 65000\nprint(uang >= total)',o:['True','False','15000','Error'],a:1,e:'Uang kurang dari total, jadi hasilnya False.'},
{q:'Untuk kondisi tambahan setelah if, Python memakai kata kunci…',o:['elseif','elif','then','case'],a:1,e:'elif dipakai untuk memeriksa kondisi berikutnya.'}]},
{n:'Keranjang Belanja',ic:'🛒',p:['Perulangan for','Perulangan while','Keranjang belanja','Menu kasir berulang','Latihan mini proyek'],q:[
{q:'Apa output kode ini?',c:'total = 0\nfor h in [5000, 7000, 3000]:\n    total += h\nprint(total)',o:['3000','7000','15000','0'],a:2,e:'Setiap harga ditambahkan ke total: 5000 + 7000 + 3000.'},
{q:'Menu kasir yang terus muncul sampai pengguna memilih “keluar” paling cocok memakai…',o:['while','for range(3)','if','def'],a:0,e:'while berjalan selama kondisi benar, tanpa jumlah putaran pasti.'},
{q:'Apa output kode ini?',c:'for i in range(3):\n    print(i)',o:['1 2 3','0 1 2','0 1 2 3','1 2'],a:1,e:'range(3) menghasilkan 0, 1, 2.'},
{q:'Jika i += 1 lupa ditulis di dalam while i <= 3, yang terjadi adalah…',o:['Program berhenti','Infinite loop','Error sintaks','Output kosong'],a:1,e:'Nilai i tidak berubah, kondisi selalu benar, perulangan tidak berhenti.'}]}
];
const R=L,PT=[10,10,10,20];
const C=['#0f8f7f','#d9731a','#7a4fd6'];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const app=document.getElementById('app');
let S=null;
const KEY='kq_turnamen';
function persist(){try{if(S&&!S.done)localStorage.setItem(KEY,JSON.stringify(S));else localStorage.removeItem(KEY)}catch(e){}}
function saved(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');
 if(!v||!Array.isArray(v.sc)||v.sc.length!==3||!v.sc.every(Number.isFinite)||!Number.isInteger(v.r)||v.r<0||v.r>3||!Number.isInteger(v.k)||v.k<0||v.k>3)return null;
 if(!Array.isArray(v.got)||v.got.length!==3)v.got=[false,false,false];
 v.show=!!v.show;v.recap=!!v.recap;v.done=false;return v}catch(e){return null}}
const sb=()=>`<div class="sb">${S.sc.map((v,i)=>`<div class="tm" style="--c:${C[i]}"><b>Kelompok ${i+1}</b><span>${v}</span></div>`).join('')}</div>`;
function home(){
 S=null;const sv=saved();
 app.innerHTML=`<h1>Kasir Quest: Turnamen Kelas</h1><p>Satu sesi 4 JP, 4 ronde, 3 kelompok. Tiap ronde membahas satu tahap membangun aplikasi kasir UMKM. Ronde 4 poinnya dobel.</p>
 <div class="card"><h2>Cara main</h2><ol class="how"><li>Guru menampilkan soal di layar.</li><li>Kelompok berdiskusi, lalu mengangkat kartu A, B, C, atau D bersamaan.</li><li>Guru menekan Tampilkan jawaban dan mengetuk kelompok yang benar.</li></ol></div>
 ${sv?`<button class="cta" id="rs2">Lanjutkan: ronde ${sv.r+1}, soal ${sv.k+1}</button>`:''}<button class="cta${sv?' ghost':''}" id="go"${sv?' style="border:2px solid var(--ink)"':''}>${sv?'Mulai baru':'Mulai ronde 1'}</button>`;
 const rs2=document.getElementById('rs2');if(rs2)rs2.onclick=()=>{S=sv;draw()};
 document.getElementById('go').onclick=()=>{S={r:0,k:0,sc:[0,0,0],show:false,got:[false,false,false],recap:false,done:false};draw()};
}
function draw(){
 if(!S)return home();
 persist();
 if(S.done)return final();
 const rd=R[S.r];
 if(S.recap){
  const mx=Math.max(...S.sc),lead=S.sc.filter(v=>v===mx).length>1?'Skor teratas masih seri.':'Memimpin: Kelompok '+(S.sc.indexOf(mx)+1)+'.';
  app.innerHTML=sb()+`<div class="card" style="text-align:center"><h2>Ronde ${S.r+1} selesai</h2><p>${lead}</p>${S.r<3?`<p>Berikutnya: ${R[S.r+1].n}${S.r===2?' (poin dobel)':''}.</p>`:''}</div><button class="cta" id="nx">${S.r<3?'Mulai ronde '+(S.r+2):'Lihat pemenang'}</button>`;
  document.getElementById('nx').onclick=()=>{if(S.r<3){S.r++;S.k=0;S.recap=false;S.show=false;S.got=[false,false,false]}else S.done=true;draw()};
  return;
 }
 const q=rd.q[S.k],pts=PT[S.r];
 app.innerHTML=sb()+`<div class="top"><span>${rd.ic} Ronde ${S.r+1}: ${rd.n}</span><span>Soal ${S.k+1}/4 · ${pts} poin</span></div><div class="bar"><i style="width:${S.k/4*100}%"></i></div>
 <div class="card"><h2>${esc(q.q)}</h2>${q.c?`<pre>${esc(q.c)}</pre>`:''}${q.o.map((o,j)=>`<div class="opt${S.show&&j===q.a?' ok':''}"><b>${'ABCD'[j]}.</b> ${esc(o)}</div>`).join('')}
 ${S.show?`<div class="fb"><b>Jawaban ${'ABCD'[q.a]}.</b> ${esc(q.e)}</div><p>Ketuk kelompok yang menjawab benar:</p><div class="tgs">${[0,1,2].map(i=>`<button class="tgb" style="--c:${C[i]}" aria-pressed="${S.got[i]}" data-i="${i}">Kelompok ${i+1}</button>`).join('')}</div><button class="cta" id="nx">${S.k<3?'Soal berikutnya':'Selesai ronde'}</button>`:`<button class="cta" id="sh">Tampilkan jawaban</button>`}</div>`;
 const sh=document.getElementById('sh');if(sh)sh.onclick=()=>{S.show=true;draw()};
 app.querySelectorAll('.tgb').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;S.got[i]=!S.got[i];S.sc[i]+=S.got[i]?pts:-pts;draw()});
 const nx=document.getElementById('nx');if(nx)nx.onclick=()=>{if(S.k<3){S.k++;S.show=false;S.got=[false,false,false]}else S.recap=true;draw()};
}
function final(){
 const o=[0,1,2].sort((a,b)=>S.sc[b]-S.sc[a]),top=S.sc[o[0]],w=o.filter(i=>S.sc[i]===top).map(i=>'Kelompok '+(i+1));
 app.innerHTML=`<div class="card" style="text-align:center"><h2>${w.length>1?'Seri: '+w.join(', '):w[0]+' juara hari ini!'}</h2><div class="big">🏆</div></div>`+
 o.map(i=>`<div class="card top" style="border-top:10px solid ${C[i]}"><span>Peringkat ${1+o.filter(j=>S.sc[j]>S.sc[i]).length} · Kelompok ${i+1}</span><span>${S.sc[i]} poin</span></div>`).join('')+
 `<button class="cta ghost" id="rs" style="border:2px solid var(--ink)">Main ulang</button>`;
 document.getElementById('rs').onclick=home;
}
home();
</script>
</body>
</html>
